[project]
name = "plug-n-rag"
version = "0.5.0"
description = "Semantische Suche für Obsidian-Vaults und Dokumentensammlungen in Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "pypdf>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
aufnahme = [
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.scripts]
plug-n-rag = "plug_n_rag.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plug_n_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: tests that download and run the real local embedding model",
    "voyage: tests that call the Voyage API (need VOYAGE_API_KEY)",
]
